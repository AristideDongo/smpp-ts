name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # provenance npm

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # No `registry-url`: it writes an .npmrc with `always-auth` (unknown to npm 11) and a placeholder
          # token. changesets/action handles npm Trusted Publishing (OIDC) on its own.
      # Trusted Publishing (OIDC): npm ≥ 11.5.1, no stored token, no 2FA code.
      # Requires a trusted publisher on npmjs.com: package smpp-ts → Settings → Trusted publishing →
      # GitHub Actions, repository AristideDongo/smpp-ts, workflow release.yml.
      - run: npm install -g npm@11
      - run: npm ci
      - uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
