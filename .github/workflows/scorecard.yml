name: Scorecard

# OpenSSF Scorecard: supply-chain security checks, published on scorecard.dev (badge in the README).
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # gcr.io images (v2.4.0 and earlier) can no longer be pulled; v2.5.0 is on ghcr.io.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
