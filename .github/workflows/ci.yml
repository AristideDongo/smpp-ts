name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # What users install: no known vulnerability from "moderate" up.
      - run: npm audit --omit=dev --audit-level=moderate
      # Development tools (never shipped): blocking from "high" up.
      - run: npm audit --audit-level=high
      # API reference and guides build without warnings (broken links, missing exports).
      - run: npm run docs:check
      - run: npm run build
      - run: node dist/cli.js --version && node dist/cli.js --help > /dev/null
      # Publishing to JSR must keep working (dry run, no token needed).
      - run: npm run jsr:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run coverage

  runtimes:
    name: smoke (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun test/runtime/smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run --allow-net --allow-read --allow-env test/runtime/smoke.mjs

  interop:
    name: interop (${{ matrix.peer }})
    runs-on: ubuntu-latest
    # Third-party implementations: a failure flags a variant to handle, without blocking the PR
    # until the suite has been green over several runs.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # smpp-ts client against third-party SMSCs, smpp-ts server against third-party clients.
        peer: [smscsim, jsmpp, python-smpplib, gosmpp]
    env:
      # The `ukarim/smscsim:latest` Docker Hub image is not built for amd64:
      # build the simulator from source, at a pinned commit.
      SMSCSIM_REF: 92ca8a83a1c84326421ad61a9cc9eb177931ee5f
      JSMPP_VERSION: 3.0.2
      JSMPP_SHA256: 0440dc07ebcad177d403876539cd9fc5047ec853fae8349075c61a56a4df39d0
      SLF4J_VERSION: 2.0.16
      SLF4J_SHA256: a12578dde1ba00bd9b816d388a0b879928d00bab3c83c240f7013bf4196c579a
      SMPPLIB_VERSION: 2.2.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---------------------------------------------------------------- smscsim (Go SMSC)
      - if: matrix.peer == 'smscsim' || matrix.peer == 'gosmpp'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - if: matrix.peer == 'smscsim'
        run: go install github.com/ukarim/smscsim@${SMSCSIM_REF}
      - if: matrix.peer == 'smscsim'
        name: Start SMSC simulator
        run: |
          nohup "$(go env GOPATH)/bin/smscsim" > peer.log 2>&1 &
          for i in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/2775) 2>/dev/null && exit 0; sleep 0.2; done
          cat peer.log; exit 1

      # ---------------------------------------------------------------- jsmpp (Java SMSC)
      - if: matrix.peer == 'jsmpp'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.peer == 'jsmpp'
        name: Start jsmpp SMSC
        run: |
          curl -sSfLo jsmpp.jar "https://repo1.maven.org/maven2/org/jsmpp/jsmpp/${JSMPP_VERSION}/jsmpp-${JSMPP_VERSION}.jar"
          curl -sSfLo slf4j-api.jar "https://repo1.maven.org/maven2/org/slf4j/slf4j-api/${SLF4J_VERSION}/slf4j-api-${SLF4J_VERSION}.jar"
          echo "${JSMPP_SHA256}  jsmpp.jar" | sha256sum -c
          echo "${SLF4J_SHA256}  slf4j-api.jar" | sha256sum -c
          nohup java -cp jsmpp.jar:slf4j-api.jar test/interop/servers/JsmppSmsc.java 2775 > peer.log 2>&1 &
          for i in $(seq 1 100); do (echo > /dev/tcp/127.0.0.1/2775) 2>/dev/null && exit 0; sleep 0.3; done
          cat peer.log; exit 1

      - if: matrix.peer == 'smscsim' || matrix.peer == 'jsmpp'
        run: npm run test:interop
        env:
          SMPP_INTEROP_URL: smpp://127.0.0.1:2775

      # ---------------------------------------------------------------- python-smpplib (Python client)
      - if: matrix.peer == 'python-smpplib'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: matrix.peer == 'python-smpplib'
        run: pip install "smpplib==${SMPPLIB_VERSION}"
      - if: matrix.peer == 'python-smpplib'
        run: npm run test:interop
        env:
          SMPP_INTEROP_CLIENT: python test/interop/clients/python_smpplib.py

      # ---------------------------------------------------------------- gosmpp (Go client)
      - if: matrix.peer == 'gosmpp'
        run: go build -o gosmpp-client .
        working-directory: test/interop/clients/gosmpp
      - if: matrix.peer == 'gosmpp'
        run: npm run test:interop
        env:
          SMPP_INTEROP_CLIENT: test/interop/clients/gosmpp/gosmpp-client

      - if: always() && (matrix.peer == 'smscsim' || matrix.peer == 'jsmpp')
        run: cat peer.log

  bench:
    # Same runner for the base branch and the PR: absolute numbers vary between runners,
    # a relative comparison does not.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            base/package-lock.json
      - run: npm ci && npm run build
      # A base that does not build (e.g. the PR repairs it) has nothing to compare against.
      - id: base
        run: npm ci && npm run build
        working-directory: base
        continue-on-error: true
      - if: steps.base.outcome != 'success'
        run: |
          echo "Base branch does not build: comparison skipped." | tee -a "$GITHUB_STEP_SUMMARY"
      # The PR's bench script measures both builds, so the base needs no bench/ folder.
      - if: steps.base.outcome == 'success'
        run: node bench/run.mjs --dist base/dist --runs 5 --json base.json
      - if: steps.base.outcome == 'success'
        run: node bench/run.mjs --runs 5 --json head.json
      - name: Compare
        if: steps.base.outcome == 'success'
        run: |
          set -o pipefail
          node bench/compare.mjs base.json head.json | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fuzz
