name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=moderate
      - run: npm run build
      # Publishing to JSR must keep working (dry run, no token needed).
      - run: npm run jsr:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run coverage

  runtimes:
    name: smoke (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun test/runtime/smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run --allow-net --allow-read --allow-env test/runtime/smoke.mjs

  interop:
    runs-on: ubuntu-latest
    # Third-party simulator: a failure flags a variant to handle, without blocking the PR
    # until the suite has been green over several runs.
    continue-on-error: true
    env:
      # The `ukarim/smscsim:latest` Docker Hub image is not built for amd64:
      # build the simulator from source, at a pinned commit.
      SMSCSIM_REF: 92ca8a83a1c84326421ad61a9cc9eb177931ee5f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: go install github.com/ukarim/smscsim@${SMSCSIM_REF}
      - name: Start SMSC simulator
        run: |
          nohup "$(go env GOPATH)/bin/smscsim" > smscsim.log 2>&1 &
          for i in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/2775) 2>/dev/null && exit 0; sleep 0.2; done
          cat smscsim.log; exit 1
      - run: npm ci
      - run: npm run test:interop
        env:
          SMPP_INTEROP_URL: smpp://127.0.0.1:2775
      - if: always()
        run: cat smscsim.log

  bench:
    # Same runner for the base branch and the PR: absolute numbers vary between runners,
    # a relative comparison does not.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            base/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci && npm run build
        working-directory: base
      # The PR's bench script measures both builds, so the base needs no bench/ folder.
      - run: node bench/run.mjs --dist base/dist --runs 5 --json base.json
      - run: node bench/run.mjs --runs 5 --json head.json
      - name: Compare
        run: |
          set -o pipefail
          node bench/compare.mjs base.json head.json | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fuzz
