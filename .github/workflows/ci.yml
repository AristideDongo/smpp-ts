name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # What users install: no known vulnerability from "moderate" up.
      - run: npm audit --omit=dev --audit-level=moderate
      # Development tools (never shipped): blocking from "high" up.
      - run: npm audit --audit-level=high
      # API reference and guides build without warnings (broken links, missing exports).
      - run: npm run docs:check
      - run: npm run build
      - run: node dist/cli.js --version && node dist/cli.js --help > /dev/null
      # Publishing to JSR must keep working (dry run, no token needed).
      - run: npm run jsr:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run coverage

  # Other operating systems: the CLI, sockets and TLS behave the same on Windows and macOS.
  # Advisory until the suite has been green over several runs (same policy as interop).
  test-os:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:runtime

  runtimes:
    name: smoke (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: matrix.runtime == 'bun'
        run: bun test/runtime/smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run --allow-net --allow-read --allow-env test/runtime/smoke.mjs

  interop:
    name: interop (${{ matrix.peer }})
    runs-on: ubuntu-latest
    # Third-party implementations: a failure flags a variant to handle, without blocking the PR
    # until the suite has been green over several runs.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # smpp-ts client against third-party SMSCs, smpp-ts server against third-party clients.
        peer: [smscsim, jsmpp, cloudhopper, python-smpplib, gosmpp, php8-smpp]
    env:
      # The `ukarim/smscsim:latest` Docker Hub image is not built for amd64:
      # build the simulator from source, at a pinned commit.
      SMSCSIM_REF: 92ca8a83a1c84326421ad61a9cc9eb177931ee5f
      JSMPP_VERSION: 3.0.2
      JSMPP_SHA256: 0440dc07ebcad177d403876539cd9fc5047ec853fae8349075c61a56a4df39d0
      SLF4J_VERSION: 2.0.16
      SLF4J_SHA256: a12578dde1ba00bd9b816d388a0b879928d00bab3c83c240f7013bf4196c579a
      SMPPLIB_VERSION: 2.2.4
      # Cloudhopper SMPP 5.0.9 (Netty 3) and its runtime dependencies, from Maven Central.
      CH_SMPP_SHA256: a9235c5c00270e0477bb5d32ad832f7c252ad2c8a397f48abc91486791923721
      CH_UTIL_SHA256: c5867cac3c83e2a951e0228a47e925fe9b1f434607829b638e7e18f0c965012e
      CH_CHARSET_SHA256: 2cf0ec764f16fd58ea6afeb148eb050ae0e4cc33c2b1d74e94a81ad6b98bd167
      NETTY3_SHA256: 203a5cb5da719adc6990abf60cc57eaa3e92fafbe1e550e076d60ad523e28f30
      SLF4J17_SHA256: 20d68d0c2e4fb984ffc164852b8b68df49a2b8716076f576881bcef7649a0e35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---------------------------------------------------------------- smscsim (Go SMSC)
      - if: matrix.peer == 'smscsim' || matrix.peer == 'gosmpp'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: false
      - if: matrix.peer == 'smscsim'
        run: go install github.com/ukarim/smscsim@${SMSCSIM_REF}
      - if: matrix.peer == 'smscsim'
        name: Start SMSC simulator
        run: |
          nohup "$(go env GOPATH)/bin/smscsim" > peer.log 2>&1 &
          for i in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/2775) 2>/dev/null && exit 0; sleep 0.2; done
          cat peer.log; exit 1

      # ---------------------------------------------------------------- jsmpp (Java SMSC)
      - if: matrix.peer == 'jsmpp' || matrix.peer == 'cloudhopper'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.peer == 'jsmpp'
        name: Start jsmpp SMSC
        run: |
          curl -sSfLo jsmpp.jar "https://repo1.maven.org/maven2/org/jsmpp/jsmpp/${JSMPP_VERSION}/jsmpp-${JSMPP_VERSION}.jar"
          curl -sSfLo slf4j-api.jar "https://repo1.maven.org/maven2/org/slf4j/slf4j-api/${SLF4J_VERSION}/slf4j-api-${SLF4J_VERSION}.jar"
          echo "${JSMPP_SHA256}  jsmpp.jar" | sha256sum -c
          echo "${SLF4J_SHA256}  slf4j-api.jar" | sha256sum -c
          nohup java -cp jsmpp.jar:slf4j-api.jar test/interop/servers/JsmppSmsc.java 2775 > peer.log 2>&1 &
          for i in $(seq 1 100); do (echo > /dev/tcp/127.0.0.1/2775) 2>/dev/null && exit 0; sleep 0.3; done
          cat peer.log; exit 1

      # ---------------------------------------------------------------- Cloudhopper (Java SMSC)
      - if: matrix.peer == 'cloudhopper'
        name: Start Cloudhopper SMSC
        run: |
          M=https://repo1.maven.org/maven2
          curl -sSfLo ch-smpp.jar "$M/com/fizzed/ch-smpp/5.0.9/ch-smpp-5.0.9.jar"
          curl -sSfLo ch-commons-util.jar "$M/com/cloudhopper/ch-commons-util/6.0.2/ch-commons-util-6.0.2.jar"
          curl -sSfLo ch-commons-charset.jar "$M/com/cloudhopper/ch-commons-charset/3.0.2/ch-commons-charset-3.0.2.jar"
          curl -sSfLo netty.jar "$M/io/netty/netty/3.9.6.Final/netty-3.9.6.Final.jar"
          curl -sSfLo slf4j-api.jar "$M/org/slf4j/slf4j-api/1.7.13/slf4j-api-1.7.13.jar"
          echo "${CH_SMPP_SHA256}  ch-smpp.jar" | sha256sum -c
          echo "${CH_UTIL_SHA256}  ch-commons-util.jar" | sha256sum -c
          echo "${CH_CHARSET_SHA256}  ch-commons-charset.jar" | sha256sum -c
          echo "${NETTY3_SHA256}  netty.jar" | sha256sum -c
          echo "${SLF4J17_SHA256}  slf4j-api.jar" | sha256sum -c
          nohup java -cp ch-smpp.jar:ch-commons-util.jar:ch-commons-charset.jar:netty.jar:slf4j-api.jar \
            test/interop/servers/CloudhopperSmsc.java 2775 > peer.log 2>&1 &
          for i in $(seq 1 100); do (echo > /dev/tcp/127.0.0.1/2775) 2>/dev/null && exit 0; sleep 0.3; done
          cat peer.log; exit 1

      - if: matrix.peer == 'smscsim' || matrix.peer == 'jsmpp' || matrix.peer == 'cloudhopper'
        run: npm run test:interop
        env:
          SMPP_INTEROP_URL: smpp://127.0.0.1:2775

      # ---------------------------------------------------------------- python-smpplib (Python client)
      - if: matrix.peer == 'python-smpplib'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - if: matrix.peer == 'python-smpplib'
        run: pip install "smpplib==${SMPPLIB_VERSION}"
      - if: matrix.peer == 'python-smpplib'
        run: npm run test:interop
        env:
          SMPP_INTEROP_CLIENT: python test/interop/clients/python_smpplib.py

      # ---------------------------------------------------------------- gosmpp (Go client)
      - if: matrix.peer == 'gosmpp'
        run: go build -o gosmpp-client .
        working-directory: test/interop/clients/gosmpp
      - if: matrix.peer == 'gosmpp'
        run: npm run test:interop
        env:
          SMPP_INTEROP_CLIENT: test/interop/clients/gosmpp/gosmpp-client

      # ---------------------------------------------------------------- php8-smpp (PHP client)
      # PHP and Composer from the Ubuntu archive (no third-party action).
      - if: matrix.peer == 'php8-smpp'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends php-cli php-mbstring composer
          php -v && php -m | grep -qx sockets && php -m | grep -qx mbstring
      - if: matrix.peer == 'php8-smpp'
        run: composer install --no-interaction --no-progress
        working-directory: test/interop/clients/php8-smpp
      - if: matrix.peer == 'php8-smpp'
        run: npm run test:interop
        env:
          SMPP_INTEROP_CLIENT: php test/interop/clients/php8-smpp/client.php

      - if: always() && (matrix.peer == 'smscsim' || matrix.peer == 'jsmpp' || matrix.peer == 'cloudhopper')
        run: cat peer.log

  kannel:
    name: interop (kannel)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Kannel 1.4.5 from the Ubuntu archive: bearerbox (SMPP client of the smpp-ts server) and smsbox.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends kannel
      # The package starts a system Kannel on the default ports: stop it, the test runs its own.
      - run: sudo systemctl stop kannel || true
      - run: npm run test:kannel

  jasmin:
    name: interop (jasmin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Jasmin + Redis + RabbitMQ; the upstream SMSC is played by the test on the runner (port 2776).
      - run: docker compose -f test/interop/jasmin/docker-compose.yml up -d --wait
      - run: npm run test:jasmin
      - if: always()
        run: |
          docker compose -f test/interop/jasmin/docker-compose.yml logs jasmin | tail -n 200
          docker compose -f test/interop/jasmin/docker-compose.yml exec -T jasmin sh -c 'tail -n 100 /var/log/jasmin/messages.log' || true
      - if: always()
        run: docker compose -f test/interop/jasmin/docker-compose.yml down -v

  bench:
    # Same runner for the base branch and the PR: absolute numbers vary between runners,
    # a relative comparison does not.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            base/package-lock.json
      - run: npm ci && npm run build
      # A base that does not build (e.g. the PR repairs it) has nothing to compare against.
      - id: base
        run: npm ci && npm run build
        working-directory: base
        continue-on-error: true
      - if: steps.base.outcome != 'success'
        run: |
          echo "Base branch does not build: comparison skipped." | tee -a "$GITHUB_STEP_SUMMARY"
      # The PR's bench script measures both builds, so the base needs no bench/ folder.
      - if: steps.base.outcome == 'success'
        run: node bench/run.mjs --dist base/dist --runs 5 --json base.json
      - if: steps.base.outcome == 'success'
        run: node bench/run.mjs --runs 5 --json head.json
      - name: Compare
        if: steps.base.outcome == 'success'
        run: |
          set -o pipefail
          node bench/compare.mjs base.json head.json | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fuzz
