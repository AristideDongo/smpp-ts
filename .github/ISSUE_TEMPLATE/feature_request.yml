name: Feature request
description: Something the library should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what is missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
